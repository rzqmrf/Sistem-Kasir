name: QuickRetail POS SaaS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build TypeScript & Vite assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment & run PHPUnit suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          cp .env.example .env
          php artisan key:generate
          ./vendor/bin/phpunit
